[project]
name = "code-danger-model-train"
version = "0.1.0"
description = "Code security risk detection LORA training"
requires-python = ">=3.11,<3.13"
dependencies = [
    "torch==2.11.0",
    "torchvision==0.26.0",
    "torchaudio==2.11.0",
    "transformers==4.57.2",
    "peft==0.19.1",
    "trl==1.6.0",
    "accelerate==1.12.0",
    "huggingface_hub[hf_xet]==0.36.2",
    "fastapi==0.121.1",
    "uvicorn==0.34.0",
    "scikit-learn==1.5.2",
    "safetensors>=0.4.5",
    "dotenv>=0.9.9",
    "bitsandbytes>=0.50.2",
]

[project.optional-dependencies]
infer = [
    "vllm==0.23.0",
]

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu128" }
torchvision = { index = "pytorch-cu128" }
torchaudio = { index = "pytorch-cu128" }
