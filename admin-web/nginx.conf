# admin-web Nginx 站点配置（T：容器化部署）
# 职责：
#   1. 静态托管 Vite 构建产物 /usr/share/nginx/html（SPA history 路由回退到 index.html）
#   2. 反向代理 /admin-api/ → admin-server 服务（compose 网络内服务名寻址）
server {
    listen       80;
    server_name  _;

    root  /usr/share/nginx/html;
    index index.html;

    # gzip 压缩（JS/CSS 产物体积显著下降）
    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # 后端 API 反向代理：保留 /admin-api 前缀（admin-server context-path 即 /admin-api）
    location /admin-api/ {
        proxy_pass http://admin-server:9090;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Remember-Me HttpOnly Cookie 透传（SameSite 由应用侧控制）
        proxy_cookie_path /admin-api/ /admin-api/;
        # 导出等较慢接口放宽超时
        proxy_connect_timeout 10s;
        proxy_read_timeout    120s;
        client_max_body_size  20m;
    }

    # 带 hash 的静态资源长缓存（Vite 产物文件名含内容 hash）
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # SPA 前端路由回退
    location / {
        try_files $uri $uri/ /index.html;
    }

    # index.html 不缓存，保证发版即时生效
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }
}
