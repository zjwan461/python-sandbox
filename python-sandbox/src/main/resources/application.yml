spring:
  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 50MB

server:
  port: 8080

sandbox:
  api-key: ${SANDBOX_API_KEY:sandbox-secret-key}
  image: python:3.12-trixie
  container-name-prefix: python-sandbox-
  session-timeout-millis: 86400000       # 会话超时时间，默认 24 小时
  session-cleanup-interval-millis: 3600000  # 清理检查间隔，默认 1 小时
  max-containers: 10                     # 最大活跃容器数量，默认 10 个
  max-containers-behavior: reject        # reject / evict-oldest
  pull-image-on-startup: false           # 是否在应用启动时预拉取 Python 镜像
  # Docker 连接配置
  docker-host: ${DOCKER_HOST:unix:///var/run/docker.sock}           # Docker 守护进程地址，留空自动检测本地 socket
                                         # 示例：tcp://192.168.1.100:2375 或 unix:///var/run/docker.sock
  docker-cert-path: ${DOCKER_CERT_PATH:} # TLS 证书目录路径（启用 TLS 时必填）
                                         # 目录下应包含 ca.pem、cert.pem、key.pem
  docker-tls-verify: ${DOCKER_TLS_VERIFY:false}  # 是否启用 TLS 验证
  docker-api-version: ${DOCKER_API_VERSION:}     # Docker API 版本号，留空使用默认版本

logging:
  level:
    com.itsu.sandbox: INFO
