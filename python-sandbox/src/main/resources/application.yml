spring:
  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 50MB
  
  # 数据源配置
  datasource:
    url: ${DB_URL:jdbc:mysql://mysql:3306/sandbox?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:root}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 5
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000
  
# MyBatis-Plus 配置
mybatis-plus:
  mapper-locations: classpath*:/mapper/**/*.xml
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.slf4j.Slf4jImpl
  global-config:
    db-config:
      id-type: auto
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

server:
  port: 8080

sandbox:
  api-key: ${SANDBOX_API_KEY:sandbox-secret-key}
  image: ${SANDBOX_IMAGE:python:3.12-trixie}
  container-name-prefix: ${SANDBOX_CONTAINER_NAME_PREFIX:python-sandbox-}
  session-timeout-millis: ${SANDBOX_SESSION_TIMEOUT_MILLIS:86400000}       # 会话超时时间，默认 24 小时
  session-cleanup-interval-millis: ${SANDBOX_SESSION_CLEANUP_INTERVAL_MILLIS:3600000}  # 清理检查间隔，默认 1 小时
  max-containers: ${SANDBOX_MAX_CONTAINERS:10}                     # 最大活跃容器数量，默认 10 个
  max-containers-behavior: ${SANDBOX_MAX_CONTAINERS_BEHAVIOR:reject}        # reject / evict-oldest
  pull-image-on-startup: ${SANDBOX_PULL_IMAGE_ON_STARTUP:false}           # 是否在应用启动时预拉取 Python 镜像
  create-default-container-on-startup: ${SANDBOX_CREATE_DEFAULT_CONTAINER_ON_STARTUP:true} # 是否在应用启动时创建默认镜像
  container-memory-limit: ${SANDBOX_CONTAINER_MEMORY_LIMIT:536870912}      # 单个容器最大内存限制（字节），默认 512MB
                                         # 设置为 0 表示不限制
                                         # 示例：512MB=536870912, 1GB=1073741824, 256MB=268435456
  # Docker 连接配置
  docker-host: ${DOCKER_HOST:unix:///var/run/docker.sock}           # Docker 守护进程地址，留空自动检测本地 socket
                                         # 示例：tcp://192.168.1.100:2375 或 unix:///var/run/docker.sock
  docker-cert-path: ${DOCKER_CERT_PATH:} # TLS 证书目录路径（启用 TLS 时必填）
                                         # 目录下应包含 ca.pem、cert.pem、key.pem
  docker-tls-verify: ${DOCKER_TLS_VERIFY:false}  # 是否启用 TLS 验证
  docker-api-version: ${DOCKER_API_VERSION:}     # Docker API 版本号，留空使用默认版本

  # 限流规则本地缓存与判定（批次4 T-0024，design.md §7.4）
  ratelimit:
    refresh-interval-millis: ${SANDBOX_RATELIMIT_REFRESH_MILLIS:60000}   # 定时拉取 ratelimit_rule 间隔，默认 60s
    cleanup-interval-millis: ${SANDBOX_RATELIMIT_CLEANUP_MILLIS:600000}  # 计数器清理间隔，默认 10min
    anonymous-allowed-fallback: ${SANDBOX_RATELIMIT_ANON_FALLBACK:false} # sys_config 缺失 ratelimit.anonymous.allowed 时的回落值（默认严格）

  # 管理端内部接口凭证（批次4 T-0026，design.md §6.3 默认决策 #9）
  # 独立于客户端 ApiKey；仅 ENV 覆盖，不写入数据库。空值时拒绝一切 /internal/** 调用。
  internal:
    token: ${ADMIN_INTERNAL_TOKEN:change-me-admin-internal-token}

  # Python 代码安全校验（runPythonCode 接口）
  python-security:
    enabled: ${SANDBOX_PYTHON_SECURITY_ENABLED:true}               # 是否启用 Python 代码静态安全校验
    max-code-length: ${SANDBOX_PYTHON_CODE_MAX_LENGTH:102400}      # Python 代码最大长度（字符数），默认 100KB
    extra-blocked-modules: ${SANDBOX_PYTHON_BLOCKED_MODULES:}      # 追加禁用的模块名（逗号分隔），与默认黑名单合并
    extra-blocked-functions: ${SANDBOX_PYTHON_BLOCKED_FUNCS:}      # 追加禁用的内置函数名（逗号分隔），与默认黑名单合并
    extra-blocked-calls: ${SANDBOX_PYTHON_BLOCKED_CALLS:}          # 追加禁用的方法调用（逗号分隔，格式为 module.func），与默认黑名单合并

# Actuator 监控端点配置
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  prometheus:
    metrics:
      export:
        enabled: true
  metrics:
    tags:
      application: ${spring.application.name:python-sandbox}

logging:
  level:
    io.github.sandbox: INFO
