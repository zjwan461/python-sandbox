global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  # Prometheus 自身监控
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  # Python Sandbox API 服务监控
  - job_name: 'python-sandbox'
    metrics_path: '/actuator/prometheus'
    scrape_interval: 5s
    static_configs:
      - targets: ['sandbox-api:8080']
        labels:
          application: 'python-sandbox'
          environment: 'production'
