version: '3.8'

services:
  # MySQL 数据库服务
  mysql:
    image: mysql:8.0
    container_name: python-sandbox-mysql
    ports:
      - "3306:3306"
    environment:
      - MYSQL_ROOT_PASSWORD=${DB_PASSWORD:-root}
      - MYSQL_DATABASE=sandbox
      - MYSQL_CHARACTER_SET_SERVER=utf8mb4
      - MYSQL_COLLATION_SERVER=utf8mb4_unicode_ci
    volumes:
      - mysql-data:/var/lib/mysql
      - ./src/main/resources/db/init.sql:/docker-entrypoint-initdb.d/init.sql
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  # Python Sandbox API 服务
  sandbox-api:
    build: .
    image: ghcr.io/zjwan461/python-sandbox:v1.0.1
    container_name: python-sandbox-api
    ports:
      - "8080:8080"
    environment:
      - SANDBOX_API_KEY=${SANDBOX_API_KEY:-sandbox-secret-key}
      - SANDBOX_IMAGE=${SANDBOX_IMAGE:-python:3.12-trixie}
      - SANDBOX_CONTAINER_NAME_PREFIX=${SANDBOX_CONTAINER_NAME_PREFIX:-python-sandbox-}
      - SANDBOX_SESSION_TIMEOUT_MILLIS=${SANDBOX_SESSION_TIMEOUT_MILLIS:-86400000}
      - SANDBOX_SESSION_CLEANUP_INTERVAL_MILLIS=${SANDBOX_SESSION_CLEANUP_INTERVAL_MILLIS:-3600000}
      - SANDBOX_MAX_CONTAINERS=${SANDBOX_MAX_CONTAINERS:-10}
      - SANDBOX_MAX_CONTAINERS_BEHAVIOR=${SANDBOX_MAX_CONTAINERS_BEHAVIOR:-reject}
      - SANDBOX_PULL_IMAGE_ON_STARTUP=${SANDBOX_PULL_IMAGE_ON_STARTUP:-false}
      - SANDBOX_CREATE_DEFAULT_CONTAINER_ON_STARTUP=${SANDBOX_CREATE_DEFAULT_CONTAINER_ON_STARTUP:-true}
      # 单个容器的内存限制（字节），默认 512MB
      - SANDBOX_CONTAINER_MEMORY_LIMIT=${SANDBOX_CONTAINER_MEMORY_LIMIT:-536870912}
      # 本地 Docker 默认 unix socket；远程 Docker 时可在 .env 中覆盖为 tcp://host:2375
      - DOCKER_HOST=${DOCKER_HOST:-unix:///var/run/docker.sock}
      # ---- Python 代码安全校验（作用于 /exec/python 接口） ----
      - SANDBOX_PYTHON_SECURITY_ENABLED=${SANDBOX_PYTHON_SECURITY_ENABLED:-true}
      - SANDBOX_PYTHON_CODE_MAX_LENGTH=${SANDBOX_PYTHON_CODE_MAX_LENGTH:-102400}
      - SANDBOX_PYTHON_BLOCKED_MODULES=${SANDBOX_PYTHON_BLOCKED_MODULES:-}
      - SANDBOX_PYTHON_BLOCKED_FUNCS=${SANDBOX_PYTHON_BLOCKED_FUNCS:-}
      - SANDBOX_PYTHON_BLOCKED_CALLS=${SANDBOX_PYTHON_BLOCKED_CALLS:-}
      # ---- 数据库配置 ----
      - DB_URL=jdbc:mysql://mysql:3306/sandbox?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai
      - DB_USERNAME=${DB_USERNAME:-root}
      - DB_PASSWORD=${DB_PASSWORD:-root}
    volumes:
      # 默认挂载本地 Docker socket；使用远程 Docker（DOCKER_HOST=tcp://...）时请注释/删除本行
      - /var/run/docker.sock:/var/run/docker.sock
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  # Prometheus 监控服务
  prometheus:
    image: prom/prometheus:latest
    container_name: python-sandbox-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus-data:/prometheus
    restart: unless-stopped
    depends_on:
      - sandbox-api
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/usr/share/prometheus/console_libraries'
      - '--web.console.templates=/usr/share/prometheus/consoles'

volumes:
  mysql-data:
  prometheus-data:
